name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-assets:
    name: Build & Publish Release Assets
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for ColorTool
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r tools/color_tool/requirements.txt

      - name: Package ColorTool Windows Executable
        working-directory: tools/color_tool
        run: |
          pyinstaller ColorTool_v1.0.spec --clean --noconfirm
          powershell Compress-Archive -Path dist/ColorTool_v1.0.exe -DestinationPath ../../ColorTool_v1.0_Windows_x64.zip

      - name: Generate Release Checksums
        shell: bash
        run: |
          sha256sum ColorTool_v1.0_Windows_x64.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ColorTool_v1.0_Windows_x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
