; PlatformIO Project Configuration for ESP32-S3 CAM Arduino Examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cat_dog_detect
; PlatformIO only compiles .ino sketches located directly in src_dir.
; Update src_dir below to build another example (01_cat_dog_detect .. 06_qrcode).
src_dir = ESP32_S3_CAM/examples/01_cat_dog_detect

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
    .
build_flags =
    -D CORE_DEBUG_LEVEL=0

[env:cat_dog_detect]
