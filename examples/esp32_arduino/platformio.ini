; PlatformIO Project Configuration for ESP32-S3 CAM Arduino Examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cat_dog_detect
src_dir = ESP32_S3_CAM/examples

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
    ESP32_S3_CAM
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -I ESP32_S3_CAM/src

[env:cat_dog_detect]
build_src_filter = +<01_cat_dog_detect/*.ino>

[env:color_detect]
build_src_filter = +<02_color_detect/*.ino>

[env:face_detect]
build_src_filter = +<03_face_detect/*.ino>

[env:face_recognition]
build_src_filter = +<04_face_recognition/*.ino>

[env:image_transmission]
build_src_filter = +<05_image_transmission/*.ino>

[env:qrcode]
build_src_filter = +<06_qrcode/*.ino>
