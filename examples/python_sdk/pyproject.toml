[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-s3-cam"
version = "1.0.0"
description = "Python I2C Master SDK for ESP32-S3-CAM Offline Vision Platform"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "HanerQAQ", email = "HanerQAQ@users.noreply.github.com"}
]
keywords = ["esp32-s3", "computer-vision", "i2c", "raspberry-pi", "jetson-orin", "ai-camera"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["esp32_s3_cam*"]
